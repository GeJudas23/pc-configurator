services:
  db:
    image: postgres:15-alpine
    container_name: pc_configurator_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  django:
    build: ./backend
    container_name: pc_configurator_django
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - static_volume:/app/staticfiles
    restart: unless-stopped

  react:
    build: ./frontend
    container_name: pc_configurator_react
    # Копируем собранный dist в общий том при старте
    command: sh -c "cp -r /usr/share/nginx/html/. /react_build/ && echo 'React build copied'"
    volumes:
      - react_build:/react_build
    restart: "no"

  nginx:
    build: ./nginx
    container_name: pc_configurator_nginx
    ports:
      - "80:80"
    depends_on:
      - django
      - react
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - react_build:/usr/share/nginx/html
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  react_build:
